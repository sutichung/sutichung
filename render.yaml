services:
  - type: web
    name: taiwan-stock-hunter
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8787"
      - key: FUGLE_BASE_URL
        value: https://api.fugle.tw/marketdata/v1.0/stock
