name: Taiwan market scan and close review
on:
  schedule:
    # Taiwan cash market: 09:00–13:59 (UTC+8 = 01:00–05:59 UTC), weekdays.
    - cron: "*/15 1-4 * * 1-5"
    - cron: "0,15,30 5 * * 1-5"
    # One-hour outcome checkpoints: 10:00–13:00 Taiwan time.
    - cron: "0 2-5 * * 1-5"
    # Close review after the cash session: 13:40 Taiwan time.
    - cron: "40 5 * * 1-5"
    # Re-run close research after official exchange institutional data is normally published.
    - cron: "10 13 * * 1-5"
    # Daily system and provider health review at 06:00 Taiwan time (22:00 UTC).
    - cron: "0 22 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  # Keep hourly outcome jobs from being replaced by the next five-minute scan run.
  group: ${{ github.event.schedule == '0 2-5 * * 1-5' && 'taiwan-market-hourly-outcomes' || 'taiwan-market-automation' }}
  cancel-in-progress: false
jobs:
  intraday-scan:
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '*/15 1-4 * * 1-5' || github.event.schedule == '0,15,30 5 * * 1-5')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh full-market scan and quote snapshot
        env:
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        run: |
          OIDC_TOKEN=$(curl --fail --silent --show-error --get --data-urlencode "audience=taiwan-stock-hunter-automation" "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null" || { echo "Unable to obtain GitHub Actions OIDC token"; exit 1; }
          echo "::add-mask::$OIDC_TOKEN"
          AUTH_HEADER="Authorization: Bearer $OIDC_TOKEN"
          curl --fail --silent --show-error --max-time 45 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/snapshot" -o /tmp/snapshot.json
          curl --fail --silent --show-error --max-time 45 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/institutional-flows" -o /tmp/flows.json
          curl --fail --silent --show-error --max-time 45 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/futures" -o /tmp/futures.json
          curl --fail --silent --show-error --max-time 45 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/sentiment" -o /tmp/sentiment.json
          curl --silent --show-error --max-time 180 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/scan" -o /tmp/scan.json
          SCAN_STATUS=$(node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/scan.json','utf8')); process.stdout.write(x.status||'')")
          if [ "$SCAN_STATUS" = "official_history_required" ]; then
            echo "Official historical store is not ready; skipping scan archive without using third-party data."
            exit 0
          fi
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/scan.json','utf8')); console.log('Scanned symbols:', x.scannedCount ?? Object.keys(x.data||{}).length, 'source:', x.source||'unknown')"
          mkdir -p reports
          node server/jobs/archive-intraday-snapshot.js /tmp/scan.json /tmp/snapshot.json
      - uses: actions/upload-artifact@v4
        with:
          name: taiwan-market-intraday-${{ github.run_id }}
          path: reports/intraday-snapshot.json
          retention-days: 3
  outcome-1h:
    if: github.event_name == 'schedule' && github.event.schedule == '0 2-5 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Select one-hour-old scan snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        run: |
          OIDC_TOKEN=$(curl --fail --silent --show-error --get --data-urlencode \"audience=taiwan-stock-hunter-automation\" \"$ACTIONS_ID_TOKEN_REQUEST_URL\" -H \"Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN\" | jq -r '.value')
          test -n \"$OIDC_TOKEN\" && test \"$OIDC_TOKEN\" != \"null\" || { echo \"Unable to obtain GitHub Actions OIDC token\"; exit 1; }
          echo \"::add-mask::$OIDC_TOKEN\"
          curl --silent --show-error --max-time 180 -H \"Authorization: Bearer $OIDC_TOKEN\" \"$MARKET_APP_URL/api/market/scan\" -o /tmp/scan-status.json
          SCAN_STATUS=$(node -e \"const x=JSON.parse(require('fs').readFileSync('/tmp/scan-status.json','utf8')); process.stdout.write(x.status||'')\")
          if [ \"$SCAN_STATUS\" = \"official_history_required\" ]; then
            echo \"Skipping outcome evaluation: official history is not ready; do not score old third-party snapshots.\"
            exit 0
          fi
          mkdir -p reports previous-report
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" -o /tmp/artifacts.json
          node server/jobs/select-intraday-artifact.js /tmp/artifacts.json "$GITHUB_RUN_ID" > reports/selected-intraday-horizon.json
          ARTIFACT_ID=$(jq -r '.selected.artifactId // empty' reports/selected-intraday-horizon.json)
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No valid one-hour-old intraday snapshot; evaluation is skipped, not fabricated."
          else
            curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/intraday.zip
            unzip -oq /tmp/intraday.zip -d previous-report
            PREVIOUS_REPORT=$(find previous-report -name 'intraday-snapshot.json' | head -n 1)
            if [ -z "$PREVIOUS_REPORT" ]; then echo "Intraday snapshot artifact is missing its JSON payload" >&2; exit 1; fi
            node server/jobs/evaluate-outcomes.js "$PREVIOUS_REPORT" 1h 0
          fi
          if compgen -G 'reports/outcome-review-1h-*.json' > /dev/null; then
            OIDC_TOKEN=$(curl --fail --silent --show-error --get --data-urlencode "audience=taiwan-stock-hunter-automation" "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
            test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null" || { echo "Unable to obtain GitHub Actions OIDC token"; exit 1; }
            echo "::add-mask::$OIDC_TOKEN"
            for report in reports/outcome-review-1h-*.json; do
              curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data-binary @"$report" "$MARKET_APP_URL/api/automation/research/outcomes"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taiwan-market-1h-outcome-${{ github.run_id }}
          path: reports/
          retention-days: 30
  close-review:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 5 * * 1-5' || github.event.schedule == '10 13 * * 1-5'
    outputs:
      market_open: ${{ steps.generate.outputs.market_open }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: generate
        name: Generate close review archive
        env:
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        run: |
          REPORT=$(node server/jobs/close-review.js)
          echo "$REPORT"
          MARKET_OPEN=$(printf '%s' "$REPORT" | jq -r '.marketOpen // false')
          echo "market_open=$MARKET_OPEN" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.generate.outputs.market_open == 'true'
        with:
          name: taiwan-market-close-review-${{ github.run_id }}
          path: reports/
          retention-days: 90
  daily-system-health:
    if: github.event_name == 'schedule' && github.event.schedule == '0 22 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check application and provider health
        env:
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        run: |
          OIDC_TOKEN=$(curl --fail --silent --show-error --get --data-urlencode "audience=taiwan-stock-hunter-automation" "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null" || { echo "Unable to obtain GitHub Actions OIDC token"; exit 1; }
          echo "::add-mask::$OIDC_TOKEN"
          AUTH_HEADER="Authorization: Bearer $OIDC_TOKEN"
          curl --fail --silent --show-error --max-time 30 "$MARKET_APP_URL/api/health" -o /tmp/health.json
          curl --fail --silent --show-error --max-time 90 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/diagnostics/providers" -o /tmp/providers.json
          curl --fail --silent --show-error --max-time 60 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/diagnostics/market" -o /tmp/market.json
          curl --fail --silent --show-error --max-time 120 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/crypto/market" -o /tmp/crypto.json
          node server/jobs/health-review.js /tmp/health.json /tmp/providers.json /tmp/market.json /tmp/crypto.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taiwan-market-daily-system-health-${{ github.run_id }}
          path: reports/daily-system-health.json
          retention-days: 30
  outcome-evaluation:
    if: github.event_name == 'schedule' && github.event.schedule == '40 5 * * 1-5' && needs.close-review.outputs.market_open == 'true'
    needs: close-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Evaluate one, five and twenty trading-session outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        run: |
          mkdir -p previous-report reports
          curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" -o /tmp/artifacts.json
          node server/jobs/select-outcome-artifacts.js /tmp/artifacts.json "$GITHUB_RUN_ID" > reports/selected-outcome-horizons.json
          for horizon in 1d 5d 20d; do
            case "$horizon" in 1d) sessions=1;; 5d) sessions=5;; 20d) sessions=20;; esac
            ARTIFACT_ID=$(jq -r --arg h "$horizon" '.selected[] | select(.horizon == $h) | .artifactId' reports/selected-outcome-horizons.json)
            if [ -z "$ARTIFACT_ID" ] || [ "$ARTIFACT_ID" = "null" ]; then
              echo "Insufficient historical trading sessions for $horizon; no metric will be fabricated."
              continue
            fi
            mkdir -p "previous-report/$horizon"
            curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o "/tmp/$horizon.zip"
            unzip -oq "/tmp/$horizon.zip" -d "previous-report/$horizon"
            PREVIOUS_REPORT=$(find "previous-report/$horizon" -name 'close-review-*.json' | head -n 1)
            if [ -z "$PREVIOUS_REPORT" ]; then echo "Missing close report inside $horizon artifact" >&2; exit 1; fi
            node server/jobs/evaluate-outcomes.js "$PREVIOUS_REPORT" "$horizon" "$sessions"
          done
          if compgen -G 'reports/outcome-review-*.json' > /dev/null; then
            OIDC_TOKEN=$(curl --fail --silent --show-error --get --data-urlencode "audience=taiwan-stock-hunter-automation" "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
            test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null" || { echo "Unable to obtain GitHub Actions OIDC token"; exit 1; }
            echo "::add-mask::$OIDC_TOKEN"
            for report in reports/outcome-review-*.json; do
              curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data-binary @"$report" "$MARKET_APP_URL/api/automation/research/outcomes"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taiwan-market-outcome-review-${{ github.run_id }}
          path: reports/
          retention-days: 90
