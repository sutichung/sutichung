name: Taiwan market scan and close review
on:
  schedule:
    # Taiwan cash market: 09:00–13:59 (UTC+8 = 01:00–05:59 UTC), weekdays.
    - cron: "*/5 1-4 * * 1-5"
    - cron: "0-30/5 5 * * 1-5"
    # Close review after the cash session: 13:40 Taiwan time.
    - cron: "40 5 * * 1-5"
    # Re-run close research after FinMind institutional flows are normally published.
    - cron: "10 13 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: taiwan-market-automation
  cancel-in-progress: false
jobs:
  intraday-scan:
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule == '*/5 1-4 * * 1-5' || github.event.schedule == '0-30/5 5 * * 1-5')
    runs-on: ubuntu-latest
    steps:
      - name: Refresh full-market scan
        env:
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        run: |
          test -n "$MARKET_APP_URL" || { echo "Set GitHub Actions secret MARKET_APP_URL to the deployed app URL"; exit 1; }
          OIDC_TOKEN=$(curl --fail --silent --show-error --get --data-urlencode "audience=taiwan-stock-hunter-automation" "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null" || { echo "Unable to obtain GitHub Actions OIDC token"; exit 1; }
          echo "::add-mask::$OIDC_TOKEN"
          AUTH_HEADER="Authorization: Bearer $OIDC_TOKEN"
          curl --fail --silent --show-error --max-time 45 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/snapshot" -o /tmp/snapshot.json
          curl --fail --silent --show-error --max-time 45 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/institutional-flows" -o /tmp/flows.json
          curl --fail --silent --show-error --max-time 45 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/futures" -o /tmp/futures.json
          curl --fail --silent --show-error --max-time 45 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/sentiment" -o /tmp/sentiment.json
          curl --fail --silent --show-error --max-time 180 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/scan" -o /tmp/scan.json
          node -e "const x=require('/tmp/scan.json'); console.log('Scanned symbols:', x.scannedCount ?? Object.keys(x.data||{}).length, 'source:', x.source||'unknown')"
  close-review:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 5 * * 1-5' || github.event.schedule == '10 13 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate close review archive
        env:
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        run: node server/jobs/close-review.js
      - uses: actions/upload-artifact@v4
        with:
          name: taiwan-market-close-review-${{ github.run_id }}
          path: reports/
          retention-days: 90
  outcome-evaluation:
    if: github.event_name == 'schedule' && github.event.schedule == '40 5 * * 1-5'
    needs: close-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download previous close report and evaluate outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        run: |
          mkdir -p previous-report reports
          ARTIFACT_ID=$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" | jq -r --arg run "$GITHUB_RUN_ID" '.artifacts | map(select(.name | startswith("taiwan-market-close-review-"))) | map(select((.workflow_run.id|tostring) != $run)) | sort_by(.created_at) | last | .id // empty')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No prior close report yet; first day is archive-only." > reports/outcome-review-first-run.md
          else
            curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" -o /tmp/previous-report.zip
            unzip -oq /tmp/previous-report.zip -d previous-report
            PREVIOUS_REPORT=$(find previous-report -name 'close-review-*.json' | head -n 1)
            node server/jobs/evaluate-outcomes.js "$PREVIOUS_REPORT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: taiwan-market-outcome-review-${{ github.run_id }}
          path: reports/
          retention-days: 90
