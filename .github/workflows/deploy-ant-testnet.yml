name: ANT Testnet Readiness (NO DEPLOYMENT)

on:
  workflow_dispatch:
  push:
    branches: [ant-token-testnet]
    paths:
      - "contracts/**"
      - "test/**"
      - "hardhat.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-ant-testnet.yml"

permissions:
  contents: read

concurrency:
  group: ant-testnet-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testnet-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ant-token-testnet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile ANT contracts only
        run: npm run compile:token
      - name: Run ANT contract tests only
        run: npm run test:token
      - name: Confirm deployment is intentionally disabled
        run: |
          ! grep -q 'deploy:token:testnet' .github/workflows/deploy-ant-testnet.yml
          ! grep -q 'DEPLOYER_PRIVATE_KEY' .github/workflows/deploy-ant-testnet.yml
          echo "Readiness checks only; no signer, RPC secret, transaction, or deployment step."
