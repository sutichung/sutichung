name: ANT sale event indexer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: ant-sale-event-indexer
  cancel-in-progress: false

jobs:
  index:
    if: ${{ vars.ANT_INDEXER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify indexer configuration
        env:
          ANT_INDEXER_ENABLED: ${{ vars.ANT_INDEXER_ENABLED }}
          ANT_INDEXER_CHAIN_ID: ${{ vars.ANT_INDEXER_CHAIN_ID }}
          ANT_PURCHASED_TOPIC0: ${{ vars.ANT_PURCHASED_TOPIC0 }}
          ANT_INDEXER_START_BLOCK: ${{ vars.ANT_INDEXER_START_BLOCK }}
          ANT_INDEXER_CONFIRMATIONS: ${{ vars.ANT_INDEXER_CONFIRMATIONS }}
          ANT_SALE_CONTRACT_ADDRESS: ${{ vars.ANT_SALE_CONTRACT_ADDRESS }}
          ANT_USDT_CONTRACT_ADDRESS: ${{ vars.ANT_USDT_CONTRACT_ADDRESS }}
          ANT_TOKEN_CONTRACT_ADDRESS: ${{ vars.ANT_TOKEN_CONTRACT_ADDRESS }}
          ANT_FEE_RECIPIENT_ADDRESS: ${{ vars.ANT_FEE_RECIPIENT_ADDRESS }}
          ANT_PROCEEDS_RECIPIENT_ADDRESS: ${{ vars.ANT_PROCEEDS_RECIPIENT_ADDRESS }}
          BSC_RPC_URLS: ${{ secrets.BSC_RPC_URLS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "const {parseConfig}=require('./server/jobs/ant-sale-indexer'); const c=parseConfig(process.env); console.log(JSON.stringify({chainId:c.chainId,confirmations:c.confirmations,startBlock:c.startBlock,rpcCount:c.rpcUrls.length,saleContract:c.saleContract}));"
      - name: Index confirmed ANT purchases and reconcile receipts
        env:
          ANT_INDEXER_ENABLED: ${{ vars.ANT_INDEXER_ENABLED }}
          ANT_INDEXER_CHAIN_ID: ${{ vars.ANT_INDEXER_CHAIN_ID }}
          ANT_PURCHASED_TOPIC0: ${{ vars.ANT_PURCHASED_TOPIC0 }}
          ANT_INDEXER_START_BLOCK: ${{ vars.ANT_INDEXER_START_BLOCK }}
          ANT_INDEXER_CONFIRMATIONS: ${{ vars.ANT_INDEXER_CONFIRMATIONS }}
          ANT_INDEXER_MAX_RANGE: ${{ vars.ANT_INDEXER_MAX_RANGE }}
          ANT_INDEXER_REORG_LOOKBACK: ${{ vars.ANT_INDEXER_REORG_LOOKBACK }}
          ANT_SALE_CONTRACT_ADDRESS: ${{ vars.ANT_SALE_CONTRACT_ADDRESS }}
          ANT_USDT_CONTRACT_ADDRESS: ${{ vars.ANT_USDT_CONTRACT_ADDRESS }}
          ANT_TOKEN_CONTRACT_ADDRESS: ${{ vars.ANT_TOKEN_CONTRACT_ADDRESS }}
          ANT_FEE_RECIPIENT_ADDRESS: ${{ vars.ANT_FEE_RECIPIENT_ADDRESS }}
          ANT_PROCEEDS_RECIPIENT_ADDRESS: ${{ vars.ANT_PROCEEDS_RECIPIENT_ADDRESS }}
          BSC_RPC_URLS: ${{ secrets.BSC_RPC_URLS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run ant:indexer
    steps:
      - name: Indexer disabled
        if: ${{ vars.ANT_INDEXER_ENABLED != 'true' }}
        run: echo "ANT indexer is disabled until verified testnet contracts and Supabase migration are configured."
