name: Market data refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-data-refresh.yml'
  schedule:
    # Five staggered workers provide best-effort quote refresh slots across each minute.
    # A main-branch workflow update also kicks one immediate refresh after a verified deployment.
    # Latest deployment includes official TPEx alternate-endpoint fallback and date/volume normalization.
    # GitHub scheduled events can be delayed or dropped; this is not hard real-time.
    - cron: "0-59/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  refresh-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    concurrency:
      group: market-quote-refresh-${{ github.event.schedule || 'manual' }}
      cancel-in-progress: false
    steps:
      - name: Refresh Taiwan stock quote snapshot only
        env:
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
          WORKER_SLOT: ${{ github.event.schedule || 'manual' }}
        shell: bash
        run: |
          set -uo pipefail
          echo "=== quote refresh worker: $WORKER_SLOT at $(date -u +%FT%TZ) ==="
          rm -f /tmp/tw-market.json

          OIDC_TOKEN=$(curl --fail --silent --show-error --get \
            --data-urlencode "audience=taiwan-stock-hunter-automation" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Unable to obtain GitHub Actions OIDC token"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          AUTH_HEADER="Authorization: Bearer $OIDC_TOKEN"

          request_with_retry() {
            local url="$1" output="$2" attempt
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
                -H "$AUTH_HEADER" "$url" -o "$output"; then
                return 0
              fi
              echo "::warning::Request failed (attempt $attempt/3): $url"
              sleep $((attempt * 3))
            done
            return 1
          }

          request_with_retry "$MARKET_APP_URL/api/market/snapshot" /tmp/tw-market.json &
          TW_PID=$!
          TW_OK=0
          wait "$TW_PID" && TW_OK=1 || echo "::error::Taiwan quote worker failed"

          TW_OK="$TW_OK" node - <<'NODE'
          const fs = require('node:fs');
          function read(path) {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch (error) { return { error: error.message }; }
          }
          const tw = read('/tmp/tw-market.json');
          const twCount = Number(tw.quoteCount ?? Object.keys(tw.data || {}).length);
          const result = {
            worker: process.env.WORKER_SLOT || 'manual',
            generatedAt: new Date().toISOString(),
            taiwan: {
              requestOk: process.env.TW_OK === '1',
              count: twCount,
              markets: tw.markets || tw.coverage || null,
              source: tw.source || null,
              dataMode: tw.dataMode || null,
              asOf: tw.timestamp || null,
              historyPersistence: tw.historyPersistence || null,
              error: tw.error || null
            },
          };
          console.log(JSON.stringify(result, null, 2));
          if (tw.historyPersistence && !tw.historyPersistence.persisted) console.warn('Official daily history was not persisted: ' + (tw.historyPersistence.reason || 'unknown reason'));
          if (!result.taiwan.requestOk || twCount < 1) throw new Error('No valid Taiwan official daily quotes');
          NODE

  technical-scan:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0-59/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: market-technical-scan
      cancel-in-progress: false
    steps:
      - name: Refresh and validate the slower Taiwan technical scan
        env:
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        shell: bash
        run: |
          set -euo pipefail
          MINUTE=$(date -u +%M)
          if (( 10#$MINUTE % 15 != 0 )); then
            echo "Skipping technical scan at UTC minute $MINUTE; it runs every 15 minutes."
            exit 0
          fi
          echo "=== technical scan worker at $(date -u +%FT%TZ) ==="
          OIDC_TOKEN=$(curl --fail --silent --show-error --get \
            --data-urlencode "audience=taiwan-stock-hunter-automation" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null"
          echo "::add-mask::$OIDC_TOKEN"
          AUTH_HEADER="Authorization: Bearer $OIDC_TOKEN"

          for attempt in 1 2; do
            if curl --silent --show-error --connect-timeout 10 --max-time 240 \
              -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/scan" -o /tmp/tw-scan.json; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Taiwan technical scan failed after retry"
              exit 1
            fi
            echo "::warning::Technical scan timed out or failed; retrying once"
            sleep 10
          done

          node - <<'NODE'
          const fs = require('node:fs');
          const scan = JSON.parse(fs.readFileSync('/tmp/tw-scan.json', 'utf8'));
          if (scan.status === 'official_history_required') {
            console.log('SKIPPED: official historical data store is not ready; no third-party scan will be used.');
            process.exit(0);
          }
          const count = Number(scan.scannedCount ?? Object.keys(scan.data || {}).length);
          console.log(JSON.stringify({
            generatedAt: new Date().toISOString(),
            count,
            source: scan.source || null,
            historyAsOf: scan.historyAsOf || null,
            error: scan.error || null
          }, null, 2));
          if (count < 1 || scan.error) throw new Error('Taiwan technical scan returned no validated symbols');
          NODE
