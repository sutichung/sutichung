name: Market data refresh

on:
  schedule:
    # Five staggered worker slots: one fresh runner is scheduled each minute.
    # GitHub may delay scheduled events; this is not a hard real-time guarantee.
    - cron: "0-59/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  # Keep the five offset schedules independent; a shared group would coalesce pending runs.
  group: market-data-refresh-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Rotating worker refreshes all market feeds and verifies results
        env:
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
          WORKER_SLOT: ${{ github.event.schedule || 'manual' }}
        shell: bash
        run: |
          set -uo pipefail
          echo "=== rotating market worker slot: $WORKER_SLOT at $(date -u +%FT%TZ) ==="
          rm -f /tmp/tw-market.json /tmp/tw-scan.json /tmp/crypto-market.json /tmp/us-market.json

          OIDC_TOKEN=$(curl --fail --silent --show-error --get \
            --data-urlencode "audience=taiwan-stock-hunter-automation" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Unable to obtain GitHub Actions OIDC token"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          AUTH_HEADER="Authorization: Bearer $OIDC_TOKEN"

          # Retry transient network/server failures; each market remains independent.
          request_with_retry() {
            local url="$1" output="$2" attempt
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --connect-timeout 10 --max-time 75 \
                -H "$AUTH_HEADER" "$url" -o "$output"; then
                return 0
              fi
              echo "::warning::Request failed (attempt $attempt/3): $url"
              sleep $((attempt * 3))
            done
            return 1
          }

          request_with_retry "$MARKET_APP_URL/api/market/snapshot" /tmp/tw-market.json &
          TW_PID=$!
          request_with_retry "$MARKET_APP_URL/api/market/scan" /tmp/tw-scan.json &
          SCAN_PID=$!
          request_with_retry "$MARKET_APP_URL/api/crypto/market" /tmp/crypto-market.json &
          CRYPTO_PID=$!
          request_with_retry "$MARKET_APP_URL/api/us/market" /tmp/us-market.json &
          US_PID=$!

          TW_OK=0; SCAN_OK=0; CRYPTO_OK=0; US_OK=0
          wait "$TW_PID" && TW_OK=1 || echo "::error::Taiwan quote worker failed"
          wait "$SCAN_PID" && SCAN_OK=1 || echo "::error::Taiwan technical-analysis worker failed"
          wait "$CRYPTO_PID" && CRYPTO_OK=1 || echo "::warning::Crypto feed unavailable"
          wait "$US_PID" && US_OK=1 || echo "::warning::US market feed unavailable"

          TW_OK="$TW_OK" SCAN_OK="$SCAN_OK" CRYPTO_OK="$CRYPTO_OK" US_OK="$US_OK" node - <<'NODE'
          const fs = require('node:fs');
          function read(path) {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch (error) { return { error: error.message }; }
          }
          const tw = read('/tmp/tw-market.json');
          const scan = read('/tmp/tw-scan.json');
          const crypto = read('/tmp/crypto-market.json');
          const us = read('/tmp/us-market.json');
          const twCount = Number(tw.quoteCount ?? Object.keys(tw.data || {}).length);
          const scanCount = Number(scan.scannedCount ?? Object.keys(scan.data || {}).length);
          const cryptoCount = Array.isArray(crypto.markets) ? crypto.markets.length : 0;
          const usCount = Object.keys(us.data || {}).length;
          const result = {
            worker: process.env.WORKER_SLOT || 'scheduled',
            generatedAt: new Date().toISOString(),
            taiwan: { requestOk: process.env.TW_OK === '1', count: twCount, source: tw.source || null, dataMode: tw.dataMode || null, asOf: tw.timestamp || null, error: tw.error || null },
            taiwanTechnicalScan: { requestOk: process.env.SCAN_OK === '1', count: scanCount, source: scan.source || null, historyAsOf: scan.historyAsOf || null, error: scan.error || null },
            crypto: { requestOk: process.env.CRYPTO_OK === '1', count: cryptoCount, status: crypto.status || null, licenseRequiredProviders: crypto.licenseRequiredProviders || [], error: crypto.error || null },
            us: { requestOk: process.env.US_OK === '1', count: usCount, source: us.source || null, timestamp: us.timestamp || null, error: us.error || null }
          };
          console.log(JSON.stringify(result, null, 2));
          if (!result.taiwan.requestOk || twCount < 1) throw new Error('No valid Taiwan daily quotes');
          if (!result.taiwanTechnicalScan.requestOk || scanCount < 1) throw new Error('Taiwan technical scan returned no symbols');
          if (!result.us.requestOk || usCount < 1) console.warn('US watchlist unavailable in this worker cycle');
          if (cryptoCount < 1) console.warn('Crypto data remains gated pending display/redistribution rights; no license gate bypassed.');
          NODE
