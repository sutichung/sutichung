name: Market data refresh

on:
  schedule:
    # GitHub Actions scheduled workflows have a 5-minute minimum interval.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Refresh quote and technical-analysis caches every minute
        env:
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        shell: bash
        run: |
          set -uo pipefail
          for cycle in 1 2 3 4 5; do
            CYCLE_START=$(date +%s)
            echo "=== market refresh cycle ${cycle}/5 at $(date -u +%FT%TZ) ==="
            OIDC_TOKEN=$(curl --fail --silent --show-error --get \
              --data-urlencode "audience=taiwan-stock-hunter-automation" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL" \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
            if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
              echo "::error::Unable to obtain GitHub Actions OIDC token"
              exit 1
            fi
            echo "::add-mask::$OIDC_TOKEN"
            AUTH_HEADER="Authorization: Bearer $OIDC_TOKEN"

            # Keep each market independent; one unavailable feed must not hide others.
            curl --fail --silent --show-error --max-time 90 -H "$AUTH_HEADER" \
              "$MARKET_APP_URL/api/market/snapshot" -o /tmp/tw-market.json &
            TW_PID=$!
            curl --fail --silent --show-error --max-time 90 -H "$AUTH_HEADER" \
              "$MARKET_APP_URL/api/market/scan" -o /tmp/tw-scan.json &
            SCAN_PID=$!
            curl --fail --silent --show-error --max-time 90 -H "$AUTH_HEADER" \
              "$MARKET_APP_URL/api/crypto/market" -o /tmp/crypto-market.json &
            CRYPTO_PID=$!
            curl --fail --silent --show-error --max-time 90 -H "$AUTH_HEADER" \
              "$MARKET_APP_URL/api/us/market" -o /tmp/us-market.json &
            US_PID=$!

            wait "$TW_PID" || echo "::error::Taiwan official quote refresh failed"
            wait "$SCAN_PID" || echo "::error::Taiwan technical scan refresh failed"
            wait "$CRYPTO_PID" || echo "::warning::Crypto market refresh failed"
            wait "$US_PID" || echo "::warning::US market refresh failed"

            node - <<'NODE'
          const fs = require('node:fs');
          function read(path) {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch (error) { return { error: error.message }; }
          }
          const tw = read('/tmp/tw-market.json');
          const scan = read('/tmp/tw-scan.json');
          const crypto = read('/tmp/crypto-market.json');
          const us = read('/tmp/us-market.json');
          const twCount = Number(tw.quoteCount ?? Object.keys(tw.data || {}).length);
          const scanCount = Number(scan.scannedCount ?? Object.keys(scan.data || {}).length);
          const cryptoCount = Array.isArray(crypto.markets) ? crypto.markets.length : 0;
          const usCount = Object.keys(us.data || {}).length;
          console.log(JSON.stringify({
            cycle: Number(process.env.CYCLE || 0),
            generatedAt: new Date().toISOString(),
            taiwan: { count: twCount, source: tw.source || null, dataMode: tw.dataMode || null, asOf: tw.timestamp || null, error: tw.error || null },
            taiwanTechnicalScan: { count: scanCount, source: scan.source || null, historyAsOf: scan.historyAsOf || null, error: scan.error || null },
            crypto: { count: cryptoCount, status: crypto.status || null, licenseRequiredProviders: crypto.licenseRequiredProviders || [], error: crypto.error || null },
            us: { count: usCount, source: us.source || null, timestamp: us.timestamp || null, error: us.error || null }
          }, null, 2));
          if (twCount < 1) throw new Error('No valid official Taiwan daily quotes returned');
          if (scanCount < 1) throw new Error('Taiwan technical-analysis scan returned no symbols');
          if (usCount < 1) throw new Error('US watchlist returned no quotes');
          if (cryptoCount < 1) console.warn('Crypto prices remain unavailable until redistribution/display rights are confirmed; license gate remains enabled.');
          NODE

            if [ "$cycle" -lt 5 ]; then
              ELAPSED=$(( $(date +%s) - CYCLE_START ))
              REMAINING=$(( 60 - ELAPSED ))
              if [ "$REMAINING" -gt 0 ]; then sleep "$REMAINING"; fi
            fi
          done
