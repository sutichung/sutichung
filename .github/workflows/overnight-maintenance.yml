name: Overnight Taiwan Stock Hunter maintenance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/overnight-maintenance.yml'
  schedule:
    - cron: "0 16,18,20,22 * * *" # 00:00, 02:00, 04:00, 06:00 Asia/Taipei
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: taiwan-stock-hunter-overnight-maintenance
  cancel-in-progress: false
jobs:
  verify-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build dashboard
        run: npm run build
      - name: Run backend regression tests
        run: npm run test:server
      - name: Check server syntax
        run: node --check server/index.js
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Smoke test deployed Taiwan Stock Hunter health
        run: |
          node <<'NODE'
          (async () => {
            const url = 'https://taiwan-stock-hunter-o3tt.onrender.com/api/health';
            let lastError;
            for (let i = 0; i < 12; i++) {
              try {
                const r = await fetch(url, { headers: { accept: 'application/json' } });
                if (!r.ok) throw new Error('Health endpoint returned HTTP ' + r.status);
                const b = await r.json();
                if (b.status && !['ok','healthy'].includes(String(b.status).toLowerCase())) {
                  throw new Error('Health status is not healthy');
                }
                console.log('Taiwan Stock Hunter health endpoint responded successfully.');
                return;
              } catch (e) { lastError = e; }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw lastError || new Error('Health check timeout');
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE
      - name: Record maintenance summary
        if: always()
        run: |
          {
            echo "## Taiwan Stock Hunter overnight maintenance"
            echo "- Taiwan schedule: 00:00 / 02:00 / 04:00 / 06:00"
            echo "- Dashboard build, backend tests, dependency audit, deployed health check"
            echo "- Commit: $GITHUB_SHA"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-ant-testnet-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ant-token-testnet
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ANT testnet branch dependencies
        run: npm install --no-audit --no-fund
      - name: Check status-only service syntax
        run: node --check ant-testnet-status.js
      - name: Run shared backend regression tests
        run: npm run test:server
      - name: Audit ANT testnet production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Smoke test deployed ANT testnet status-only endpoint
        run: |
          node <<'NODE'
          (async () => {
            const url = 'https://zentrax-ant-testnet.onrender.com/healthz';
            let lastError;
            for (let i = 0; i < 12; i++) {
              try {
                const r = await fetch(url, { headers: { accept: 'application/json' } });
                const b = await r.json();
                if (!r.ok || b.ok !== true || b.service !== 'ant-testnet-status' ||
                    b.mode !== 'status_only' || b.chainId !== 97 ||
                    b.mainnetDeploymentEnabled !== false ||
                    b.signerConfiguredInThisService !== false) {
                  throw new Error('ANT testnet status-only safety contract mismatch');
                }
                console.log('ANT testnet status-only endpoint passed; no signer or mainnet deployment enabled.');
                return;
              } catch (e) { lastError = e; }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw lastError || new Error('ANT testnet smoke check timeout');
          })().catch(e => { console.error(e.message); process.exit(1); });
          NODE
      - name: Record ANT testnet maintenance summary
        if: always()
        run: |
          {
            echo "## ANT testnet branch maintenance"
            echo "- Checks: status-only syntax, backend tests, production dependency audit, deployed status endpoint"
            echo "- Branch: ant-token-testnet"
            echo "- Commit: $GITHUB_SHA"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-remote-services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test Telegram, Neo Face AI, and FALCON services
        run: |
          node <<'NODE'
          const checks = [
            { name: 'Taiwan Telegram bot', url: 'https://taiwan-stock-telegram-bot-3b9o.onrender.com/healthz', service: 'taiwan-stock-telegram-bot', telegram: true },
            { name: 'Crypto Radar v2', url: 'https://telegram-crypto-radar-v2.onrender.com/healthz', service: 'telegram-crypto-radar', telegram: true },
            { name: 'Telegram webhook', url: 'https://telegram-crypto-radar-webhook.onrender.com/healthz', service: 'telegram-crypto-radar', telegram: true },
            { name: 'Neo Face AI', url: 'https://neo-face-ai-bot-4tw4.onrender.com/health', service: 'neo-face-ai-bot' },
            { name: 'FALCON', url: 'https://falcon-social-workspace.onrender.com/' }
          ];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            for (const check of checks) {
              let lastError;
              for (let attempt = 0; attempt < 12; attempt++) {
                try {
                  const response = await fetch(check.url, { headers: { accept: 'application/json' } });
                  if (!response.ok) throw new Error('HTTP ' + response.status);
                  const body = check.telegram || check.service === 'neo-face-ai-bot' ? await response.json() : null;
                  if (check.service && body?.service !== check.service) throw new Error('Unexpected service identity');
                  if (check.telegram && (body.status !== 'ok' || body.telegram_ready !== true)) {
                    throw new Error('Telegram bot is not ready: ' + JSON.stringify({status:body.status,telegram_ready:body.telegram_ready}));
                  }
                  if (check.name === 'Neo Face AI' && body?.status !== 'ok') throw new Error('Neo Face AI health status is not ok');
                  console.log(JSON.stringify({service:check.name,httpStatus:response.status,ready:true,
                    groupPushConfigured:body?.group_push_configured ?? null,
                    learningStoragePersistent:body?.learning_storage_persistent ?? null}));
                  lastError = null;
                  break;
                } catch (error) {
                  lastError = error;
                  await sleep(10000);
                }
              }
              if (lastError) throw new Error(check.name + ' failed: ' + lastError.message);
            }
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
      - name: Record remote service maintenance summary
        if: always()
        run: |
          {
            echo "## Remote service maintenance"
            echo "- Checked: Taiwan Telegram bot, Crypto Radar v2, Telegram webhook, Neo Face AI, FALCON"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
