name: Mobile app build checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [app-store-preparation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm install --no-audit --no-fund
      - run: npm run test:server
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build unsigned debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:server
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - name: Build iOS simulator app (unsigned)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO -derivedDataPath /tmp/ios-derived build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: /tmp/ios-derived/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
