name: ANT BSC testnet indexer
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: ant-bsc-testnet-indexer
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate required secrets
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.ANT_INDEXER_RPC_URL }}
          BSC_TESTNET_RPC_URL_SECONDARY: ${{ secrets.ANT_INDEXER_RPC_URL_SECONDARY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANT_SALE_CONTRACT: ${{ secrets.ANT_SALE_CONTRACT }}
          ANT_USDT_CONTRACT: ${{ secrets.ANT_USDT_CONTRACT }}
          ANT_TOKEN_CONTRACT: ${{ secrets.ANT_TOKEN_CONTRACT }}
          ANT_FEE_WALLET: ${{ secrets.ANT_FEE_WALLET }}
          ANT_TREASURY_WALLET: ${{ secrets.ANT_TREASURY_WALLET }}
          ANT_INDEXER_START_BLOCK: ${{ secrets.ANT_INDEXER_START_BLOCK }}
          ANT_USDT_DECIMALS: ${{ secrets.ANT_USDT_DECIMALS }}
        run: |
          missing=0
          for key in BSC_TESTNET_RPC_URL BSC_TESTNET_RPC_URL_SECONDARY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ANT_SALE_CONTRACT ANT_USDT_CONTRACT ANT_TOKEN_CONTRACT ANT_FEE_WALLET ANT_TREASURY_WALLET ANT_INDEXER_START_BLOCK ANT_USDT_DECIMALS; do
            if [ -z "${!key}" ]; then echo "Missing required GitHub Actions secret: $key"; missing=1; fi
          done
          test "$missing" -eq 0
      - name: Install runtime dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Index confirmed ANT sale events (BSC testnet only)
        env:
          BSC_TESTNET_RPC_URL: ${{ secrets.ANT_INDEXER_RPC_URL }}
          BSC_TESTNET_RPC_URL_SECONDARY: ${{ secrets.ANT_INDEXER_RPC_URL_SECONDARY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANT_SALE_CONTRACT: ${{ secrets.ANT_SALE_CONTRACT }}
          ANT_USDT_CONTRACT: ${{ secrets.ANT_USDT_CONTRACT }}
          ANT_TOKEN_CONTRACT: ${{ secrets.ANT_TOKEN_CONTRACT }}
          ANT_FEE_WALLET: ${{ secrets.ANT_FEE_WALLET }}
          ANT_TREASURY_WALLET: ${{ secrets.ANT_TREASURY_WALLET }}
          ANT_USDT_DECIMALS: ${{ secrets.ANT_USDT_DECIMALS }}
          ANT_INDEXER_START_BLOCK: ${{ secrets.ANT_INDEXER_START_BLOCK }}
          ANT_INDEXER_CONFIRMATIONS: '12'
          ANT_INDEXER_BLOCK_RANGE: '500'
          ANT_INDEXER_ONESHOT: 'true'
        run: node server/jobs/ant-chain-indexer.js
