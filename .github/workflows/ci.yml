name: Backend checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:server
      - run: npm install
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
