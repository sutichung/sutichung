name: Backend checks
on:
  push:
  pull_request:
concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server/index.js
      - run: node --check server/lib/indicators.js
      - run: node --check server/lib/scoring.js
      - run: node --check server/lib/agents.js
      - run: node --check server/lib/crypto-microstructure.js
      - run: npm run test:server
      - run: npm install
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - run: docker build -t taiwan-stock-hunter:ci .
