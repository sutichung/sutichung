name: Backend checks
on:
  push:
  pull_request:
  schedule:
    - cron: '17 21 * * *' # Daily 05:17 Asia/Taipei
concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server/index.js
      - run: node --check server/lib/indicators.js
      - run: node --check server/lib/scoring.js
      - run: node --check server/lib/agents.js
      - run: node --check server/lib/crypto-microstructure.js
      - name: Syntax-check automation jobs and research modules
        run: |
          for file in server/jobs/*.js server/lib/*.js; do
            node --check "$file"
          done
      - run: npm run test:server
      - run: npm install --no-audit --no-fund
      - name: Report dependency vulnerabilities
        if: always()
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const fs=require('fs');let a={};try{a=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'))}catch(e){console.log('npm audit report unavailable:',e.message);process.exit(0)};for(const [name,v] of Object.entries(a.vulnerabilities||{})){console.log(v.severity.toUpperCase(),name,'direct='+v.isDirect,'fix='+JSON.stringify(v.fixAvailable))};console.log('AUDIT_SUMMARY',JSON.stringify(a.metadata?.vulnerabilities||{}))"
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

