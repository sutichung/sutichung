name: Backend checks
on:
  push:
  pull_request:
  schedule:
    - cron: '17 21 * * *' # Daily 05:17 Asia/Taipei
concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies before tests
        run: npm install --no-audit --no-fund
      - run: node --check server/index.js
      - run: node --check server/lib/indicators.js
      - run: node --check server/lib/scoring.js
      - run: node --check server/lib/crypto-microstructure.js
      - name: Syntax-check automation jobs and research modules
        run: |
          for file in server/jobs/*.js server/lib/*.js; do
            node --check "$file"
          done
      - run: npm run test:server
      - name: Generate temporary lockfile for dependency audit
        if: always()
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Report dependency vulnerabilities
        if: always()
        run: |
          timeout 120s npm audit --json > /tmp/npm-audit.json || true
          node -e "const fs=require('fs');let a={};try{a=JSON.parse(fs.readFileSync('/tmp/npm-audit.json','utf8'))}catch(e){console.log('npm audit report unavailable:',e.message);process.exit(0)};for(const [name,v] of Object.entries(a.vulnerabilities||{})){const via=(v.via||[]).map(x=>typeof x==='string'?x:{title:x.title,url:x.url,range:x.range,severity:x.severity});console.log(JSON.stringify({name,severity:v.severity,direct:v.isDirect,range:v.range,via,fix:v.fixAvailable}))};console.log('AUDIT_SUMMARY',JSON.stringify(a.metadata?.vulnerabilities||{}))"
      - name: Audit production runtime dependencies
        if: always()
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node -e "const fs=require('fs');let a={};try{a=JSON.parse(fs.readFileSync('/tmp/npm-audit-production.json','utf8'))}catch(e){console.error('production audit unavailable:',e.message);process.exit(1)};const v=a.metadata?.vulnerabilities;if(!v){console.error('production audit returned no vulnerability summary');process.exit(1)};console.log('PRODUCTION_AUDIT_SUMMARY',JSON.stringify(v));if((v.high||0)>0||(v.critical||0)>0){console.error('High or critical production dependency vulnerabilities detected');process.exit(1)}"
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

