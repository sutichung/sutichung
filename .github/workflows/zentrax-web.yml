name: ZENTRAX web CI

on:
  push:
    branches: [main, ant-token-testnet]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "server/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/zentrax-web.yml"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "server/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/zentrax-web.yml"

permissions:
  contents: read

concurrency:
  group: zentrax-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build-and-server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build production frontend
        run: npm run build
      - name: Verify production bundle exists
        run: test -s build/index.html
      - name: Build production Docker image
        run: docker build -t zentrax-ci .
      - name: Smoke-test production container and static frontend
        run: |
          docker run -d --name zentrax-ci -p 8787:8787 -e NODE_ENV=production -e CRYPTO_STREAM_EMBEDDED=false zentrax-ci
          trap 'docker rm -f zentrax-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null
          curl --fail --silent http://127.0.0.1:8787/ | grep -q 'id="root"'
      - name: Run backend tests
        run: npm run test:server
