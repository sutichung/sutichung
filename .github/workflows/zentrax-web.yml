name: ZENTRAX web CI

on:
  push:
    branches: [ant-token-testnet]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "server/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/zentrax-web.yml"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "server/**"
      - ".github/workflows/zentrax-web.yml"

permissions:
  contents: read

concurrency:
  group: zentrax-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build-and-server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production frontend
        run: npm run build
      - name: Verify production bundle exists
        run: test -s build/index.html
      - name: Build production Docker image
        run: docker build -t zentrax-testnet-ci .
      - name: Smoke-test production container and static frontend
        run: |
          docker run -d --name zentrax-testnet-ci -p 8787:8787 -e NODE_ENV=production -e CRYPTO_STREAM_EMBEDDED=false zentrax-testnet-ci
          trap 'docker rm -f zentrax-testnet-ci >/dev/null 2>&1 || true' EXIT
          health_ok=false
          for attempt in $(seq 1 20); do
            if curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' http://127.0.0.1:8787/api/health | grep -qx '200'; then
              health_ok=true
              break
            fi
            sleep 2
          done
          if [ "$health_ok" != true ]; then
            echo "Health endpoint did not return HTTP 200"
            docker ps -a
            docker logs zentrax-testnet-ci || true
            curl --include --max-time 5 http://127.0.0.1:8787/api/health || true
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8787/ -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
      - name: Run backend tests
        run: npm run test:server
