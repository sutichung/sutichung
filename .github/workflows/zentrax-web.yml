name: ZENTRAX web CI

on:
  push:
    branches: [main, ant-token-testnet]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "server/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/zentrax-web.yml"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "server/**"
      - "Dockerfile"
      - "render.yaml"
      - ".github/workflows/zentrax-web.yml"

permissions:
  contents: read

concurrency:
  group: zentrax-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build-and-server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production frontend
        run: npm run build
      - name: Verify production bundle exists
        run: test -s build/index.html
      - name: Build production Docker image
        run: docker build -t zentrax-ci .
      - name: Smoke-test production container and static frontend
        run: |
          docker run -d --name zentrax-ci -p 8787:8787 -e NODE_ENV=production -e CRYPTO_STREAM_EMBEDDED=false zentrax-ci
          trap 'docker rm -f zentrax-ci >/dev/null 2>&1 || true' EXIT
          health_ok=false
          for attempt in $(seq 1 20); do
            if curl --connect-timeout 2 --max-time 3 --silent --show-error --output /tmp/health.json --write-out '%{http_code}' http://127.0.0.1:8787/api/health | grep -qx '200'; then
              health_ok=true
              break
            fi
            sleep 2
          done
          if [ "$health_ok" != true ]; then
            echo "Health endpoint did not return HTTP 200"
            docker ps -a
            docker logs zentrax-ci || true
            curl --include --max-time 5 http://127.0.0.1:8787/api/health || true
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8787/ -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const html = fs.readFileSync('/tmp/index.html', 'utf8');
          const assets = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+\.(?:js|css))"/g)].map(match => match[1]);
          if (!assets.some(asset => asset.endsWith('.js'))) throw new Error('production_index_missing_javascript_bundle');
          if (!assets.some(asset => asset.endsWith('.css'))) throw new Error('production_index_missing_stylesheet_bundle');
          for (const asset of assets) {
            const response = await fetch('http://127.0.0.1:8787' + asset, { signal: AbortSignal.timeout(5000) });
            if (!response.ok) throw new Error('production_asset_http_' + response.status + ':' + asset);
            const body = await response.arrayBuffer();
            if (!body.byteLength) throw new Error('production_asset_empty:' + asset);
            const expected = asset.endsWith('.js') ? 'javascript' : 'css';
            if (!response.headers.get('content-type')?.toLowerCase().includes(expected)) {
              throw new Error('production_asset_wrong_content_type:' + asset + ':' + response.headers.get('content-type'));
            }
            console.log('Verified production asset', asset, body.byteLength, 'bytes');
          }
          NODE
      - name: Run backend tests
        run: npm run test:server
