name: ZENTRAX web CI

on:
  push:
    branches: [ant-token-testnet]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "server/**"
      - ".github/workflows/zentrax-web.yml"
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "server/**"
      - ".github/workflows/zentrax-web.yml"

permissions:
  contents: read

concurrency:
  group: zentrax-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build-and-server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production frontend
        run: npm run build
      - name: Verify production bundle exists
        run: test -s build/index.html
      - name: Build production Docker image
        run: docker build -t zentrax-testnet-ci .
      - name: Run backend tests
        run: npm run test:server
