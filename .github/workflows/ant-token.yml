name: ANT token CI

on:
  push:
    branches: [ant-token-testnet]
    paths:
      - "contracts/**"
      - "test/AntColony.js"
      - "scripts/deploy-ant.js"
      - "hardhat.config.js"
      - "package.json"
      - ".github/workflows/ant-token.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/AntColony.js"
      - "scripts/deploy-ant.js"
      - "hardhat.config.js"
      - "package.json"
      - ".github/workflows/ant-token.yml"

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run compile:token
      - run: npm run test:token
