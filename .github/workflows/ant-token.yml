name: ANT token CI

on:
  push:
    branches: [main, ant-token-testnet]
    paths:
      - "contracts/**"
      - "test/**"
      - "scripts/**"
      - "hardhat.config.js"
      - "package.json"
      - ".github/workflows/ant-token.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "test/**"
      - "scripts/deploy-ant.js"
      - "hardhat.config.js"
      - "package.json"
      - ".github/workflows/ant-token.yml"

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax-check deployment scripts
        run: for file in scripts/*.js; do node --check "$file"; done
      - run: npm run compile:token
      - run: npm run test:token
