name: Production smoke
on:
  workflow_run:
    workflows: ["Backend checks"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: taiwan-production-smoke
  cancel-in-progress: false
jobs:
  verify-live-data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: wait-live
        name: Wait for the exact Render commit to become live
        env:
          EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=100 origin main
          CURRENT_MAIN=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
          git fetch --no-tags --depth=100 origin main
          if ! git merge-base --is-ancestor "$EXPECTED_COMMIT" "$CURRENT_MAIN"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping commit $EXPECTED_COMMIT because it is no longer in main history ($CURRENT_MAIN)"
            exit 0
          fi
          DEPLOY_COMMIT="$EXPECTED_COMMIT"
          for history_step in $(seq 1 20); do
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "$DEPLOY_COMMIT")
            if [ -z "$CHANGED_FILES" ] || echo "$CHANGED_FILES" | grep -Evq '^(\.github/workflows/|server/test/|docs/)'; then
              break
            fi
            PARENT_COMMIT=$(git rev-parse "$DEPLOY_COMMIT^" 2>/dev/null || true)
            [ -n "$PARENT_COMMIT" ] || break
            DEPLOY_COMMIT="$PARENT_COMMIT"
          done
          for attempt in $(seq 1 36); do
            CURRENT_MAIN=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)
            git fetch --no-tags --depth=100 origin main
            if ! git merge-base --is-ancestor "$EXPECTED_COMMIT" "$CURRENT_MAIN"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping commit $EXPECTED_COMMIT because it is no longer in main history ($CURRENT_MAIN)"
              exit 0
            fi
            if curl --fail --silent --show-error --max-time 10 "$MARKET_APP_URL/api/health" -o /tmp/health.json; then
              ACTUAL_COMMIT=$(node -e "const h=require('/tmp/health.json');process.stdout.write(h.commit||'')")
              MATCHED_COMMIT=false
              if [ "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT" ] || [ "$ACTUAL_COMMIT" = "$DEPLOY_COMMIT" ]; then
                MATCHED_COMMIT=true
              elif git merge-base --is-ancestor "$DEPLOY_COMMIT" "$ACTUAL_COMMIT" && git merge-base --is-ancestor "$ACTUAL_COMMIT" "$CURRENT_MAIN"; then
                MATCHED_COMMIT=true
              elif git merge-base --is-ancestor "$ACTUAL_COMMIT" "$EXPECTED_COMMIT"; then
                BETWEEN_FILES=$(git diff --name-only "$ACTUAL_COMMIT" "$EXPECTED_COMMIT")
                if [ -z "$BETWEEN_FILES" ] || ! printf '%s\n' "$BETWEEN_FILES" | grep -Evq '^(\.github/workflows/|server/test/|docs/)'; then
                  MATCHED_COMMIT=true
                fi
              fi
              if [ "$MATCHED_COMMIT" = true ]; then
                node -e "const h=require('/tmp/health.json');if(!h.ok||h.branch!=='main')process.exit(1)"
                echo "deploy_commit=$ACTUAL_COMMIT" >> "$GITHUB_OUTPUT"
                echo "skip=false" >> "$GITHUB_OUTPUT"
                echo "Render is serving verified commit $ACTUAL_COMMIT (source commit $EXPECTED_COMMIT)"
                exit 0
              fi
              echo "Render still serves $ACTUAL_COMMIT; waiting for $EXPECTED_COMMIT or runtime commit $DEPLOY_COMMIT"
            fi
            sleep 10
          done
          echo "Render did not activate expected/runtime commit within six minutes" >&2
          exit 1
      - name: Verify official Taiwan stock data from Render
        if: steps.wait-live.outputs.skip != 'true'
        env:
          MARKET_APP_URL: https://taiwan-stock-hunter-o3tt.onrender.com
          EXPECTED_COMMIT: ${{ steps.wait-live.outputs.deploy_commit }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          OIDC_TOKEN=$(curl --fail --silent --show-error --get --data-urlencode "audience=taiwan-stock-hunter-automation" "$ACTIONS_ID_TOKEN_REQUEST_URL" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          test -n "$OIDC_TOKEN" && test "$OIDC_TOKEN" != "null" || { echo "Unable to obtain GitHub Actions OIDC token"; exit 1; }
          echo "::add-mask::$OIDC_TOKEN"
          AUTH_HEADER="Authorization: Bearer $OIDC_TOKEN"
          echo "Checking official Taiwan market source"
          curl --fail --silent --show-error --retry 1 --retry-all-errors --retry-delay 5 --max-time 180 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/diagnostics/market" -o /tmp/market.json
          echo "Backfilling and verifying official TWSE 36-month history persistence"
          curl --fail --silent --show-error --retry 1 --retry-all-errors --retry-delay 5 --max-time 240 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/history/2330" -o /tmp/twse-history.json
          echo "Checking provider and firewall diagnostics"
          curl --fail --silent --show-error --retry 1 --retry-all-errors --retry-delay 5 --max-time 45 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/diagnostics/providers" -o /tmp/providers.json
          echo "Checking TPEx official-history strategy lab with real OHLCV bars"
          curl --silent --show-error --retry 1 --retry-all-errors --retry-delay 5 --max-time 180 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/market/research/strategies/3105?market=tw-stock" -o /tmp/tpex-strategy.json
          echo "Checking dependency vulnerability risk data"
          curl --fail --silent --show-error --retry 1 --retry-all-errors --retry-delay 5 --max-time 90 -H "$AUTH_HEADER" "$MARKET_APP_URL/api/diagnostics/vulnerabilities" -o /tmp/vulnerabilities.json
          echo "Checking that Render did not switch to a different commit during the smoke run"
          curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 --max-time 15 "$MARKET_APP_URL/api/health" -o /tmp/health-after.json
          mkdir -p reports
          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          const healthAfter = JSON.parse(fs.readFileSync('/tmp/health-after.json', 'utf8'));
          const market = JSON.parse(fs.readFileSync('/tmp/market.json', 'utf8'));
          const twseHistory = JSON.parse(fs.readFileSync('/tmp/twse-history.json', 'utf8'));
          const providers = JSON.parse(fs.readFileSync('/tmp/providers.json', 'utf8'));
          const tpexStrategy = JSON.parse(fs.readFileSync('/tmp/tpex-strategy.json', 'utf8'));
          const vulnerabilities = JSON.parse(fs.readFileSync('/tmp/vulnerabilities.json', 'utf8'));
          const taiwanProviderIds = new Set(['twse','tpex','fugle']);
          const providerFailures = (providers.checks || []).filter(x => taiwanProviderIds.has(x.id) && ['auth_error','permission_error','region_restricted','rate_limited','timeout','error','upstream_error','http_error','endpoint_error'].includes(x.status));
          const requiredProviderIds = new Set(['twse','tpex']);
          const optionalProviderRestrictions = providerFailures.filter(x => !requiredProviderIds.has(x.id)).map(x => ({ id:x.id, label:x.label, status:x.status, httpStatus:x.httpStatus, reason:x.httpStatus===451?'region_restricted':x.id==='fugle'&&x.httpStatus===403?'plan_does_not_include_requested_feature':x.id==='fugle'&&x.httpStatus===401?'invalid_api_key':'optional_provider_unavailable' }));
          const criticalProviderFailures = providerFailures.filter(x => requiredProviderIds.has(x.id));
          const ciDependencyAudit = { status:'passed', blocking:true, source:'blocking Backend checks npm audit --omit=dev', runId:Number(process.env.CI_RUN_ID), runtimeScannerStatus:vulnerabilities.status, runtimeScannedPackageCount:Number(vulnerabilities.scannedPackageCount||0), note:Number(vulnerabilities.scannedPackageCount||0)===0?'Production image intentionally excludes node_modules; Backend checks fails on high/critical production advisories and reports moderate/low findings.':'Runtime dependency scan also returned package coverage.' };
          const quoteCount = Number(market.quoteCount || 0);
          const taiwanConnected = market.ok === true && quoteCount > 0;
          const vulnerabilitySeverity = vulnerabilities.severityCounts || {};
          const warnings = [
            ...(quoteCount === 0 ? ['taiwan_market_has_no_live_quotes_at_check_time'] : []),
            ...(providerFailures.length ? ['some_optional_providers_unavailable'] : []),
            ...(twseHistory.historyPersistence?.persisted !== true ? ['official_history_not_persisted_to_supabase; live official data remains available per request'] : []),
            ...(Number(vulnerabilities.scannedPackageCount || 0) < 1 ? ['runtime_dependency_scan_unavailable_in_slim_image_ci_audit_passed'] : []),
            ...(Number(vulnerabilitySeverity.critical || 0) + Number(vulnerabilitySeverity.high || 0) > 0 ? ['high_or_critical_dependency_vulnerabilities_found'] : [])
          ];
          const report = {
            generatedAt: new Date().toISOString(),
            commit: health.commit,
            application: { ok: health.ok === true, branch: health.branch, mode: health.mode },
            taiwan: {
              ok: taiwanConnected,
              source: market.source || null,
              quoteCount,
              dataMode: market.dataMode || null,
              realtime: market.realtime === true,
              markets: market.markets || {},
              requestedCount: Number(market.requestedCount || 0),
              coveragePct: market.coveragePct ?? null,
              delayedCount: Number(market.delayedCount || 0),
              serverTime: market.serverTime || null,
              error: market.error || null,
              providerWarning: market.providerWarning || null,
              fallbackUsed: market.fallbackUsed === true
            },
            officialHistory: {
              symbol: '2330',
              source: twseHistory.source || null,
              barCount: Array.isArray(twseHistory.data) ? twseHistory.data.length : 0,
              historyStart: twseHistory.historyStart || null,
              asOf: twseHistory.asOf || null,
              requestedMonths: Number(twseHistory.requestedMonths || 0),
              failedMonthCount: Array.isArray(twseHistory.failedMonths) ? twseHistory.failedMonths.length : 0,
              persistence: twseHistory.historyPersistence || null,
              error: twseHistory.error || null
            },
            strategyLab: {
              ok: tpexStrategy.status === 'ok' && Number(tpexStrategy.barCount || 0) >= 130 && String(tpexStrategy.source || '').includes('TPEx 官方網站 afterTrading/tradingStock'),
              symbol: tpexStrategy.symbol || '3105',
              status: tpexStrategy.status || null,
              source: tpexStrategy.source || null,
              barCount: Number(tpexStrategy.barCount || 0),
              asOf: tpexStrategy.asOf || null,
              strategyCount: Number(tpexStrategy.strategyCount || 0),
              error: tpexStrategy.error || null,
              historyDiagnostics: tpexStrategy.historyDiagnostics || null
            },
            providerFailures,
            optionalProviderRestrictions,
            criticalProviderFailures,
            status: criticalProviderFailures.length ? 'failed' : optionalProviderRestrictions.length ? 'degraded' : 'healthy',
            dependencyVulnerabilities: {
              status: vulnerabilities.status,
              scannedPackageCount: Number(vulnerabilities.scannedPackageCount || 0),
              totalPackageCount: Number(vulnerabilities.totalPackageCount || 0),
              failedBatchCount: Number(vulnerabilities.failedBatchCount || 0),
              vulnerabilityCount: Number(vulnerabilities.vulnerabilityCount || 0),
              severityCounts: vulnerabilities.severityCounts || {},
              productionVulnerabilityCount: Number(vulnerabilities.productionVulnerabilityCount || 0),
              developmentVulnerabilityCount: Number(vulnerabilities.developmentVulnerabilityCount || 0),
              unknownScopeVulnerabilityCount: Number(vulnerabilities.unknownScopeVulnerabilityCount || 0),
              findings: (vulnerabilities.findings || []).slice(0,12).map(x => ({ package:x.package, version:x.version, scope:x.scope, id:x.id, severity:x.severity, summary:x.summary, affectedRange:x.affectedRange, fixedVersions:x.fixedVersions, fixAvailable:x.fixAvailable, suggestedTopLevelChange:x.suggestedTopLevelChange })),
              error: vulnerabilities.error || null
            },
            ciDependencyAudit,
            warnings,
            overallStatus: warnings.length ? 'degraded' : 'healthy'
          };
          fs.writeFileSync('reports/production-smoke.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          if (!report.application.ok) throw new Error('production_health_not_ok');
          if (healthAfter.commit !== process.env.EXPECTED_COMMIT) throw new Error('deployment_changed_during_production_smoke');
          if (!report.taiwan.ok || report.taiwan.quoteCount < 1) throw new Error('official_taiwan_market_source_unavailable');
          if (report.officialHistory.barCount < 60) throw new Error('official_twse_history_has_fewer_than_60_valid_bars');
          // Supabase persistence is optional: the official exchange history is fetched on demand and verified by bar count.
          if (!report.strategyLab.ok) throw new Error('tpex_official_history_strategy_lab_unavailable_or_insufficient_bars');
          if (report.taiwan.dataMode !== 'END_OF_DAY' || report.taiwan.realtime !== false) throw new Error('official_taiwan_data_mode_not_explicitly_end_of_day');
          if (report.criticalProviderFailures.length) throw new Error('one_or_more_critical_providers_failed');
          if (vulnerabilities.status === 'vulnerable' && Number(vulnerabilities.productionVulnerabilityCount || 0) > 0) throw new Error('production_dependency_vulnerabilities_detected');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-${{ github.run_id }}
          path: reports/production-smoke.json
          retention-days: 30
