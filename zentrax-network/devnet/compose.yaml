name: zentrax-local-devnet

x-node-common: &node-common
  image: zentrax-evmd:0.7.4
  restart: unless-stopped
  user: "${ZENTRAX_UID:-1000}:${ZENTRAX_GID:-1000}"
  working_dir: /data
  environment:
    HOME: /data
  volumes:
    - ${ZENTRAX_DEVNET_DATA:-./.local-data}:/data
  entrypoint: ["/bin/sh", "-ec"]
  command: ["exec evmd start --home \"/data/node$$NODE_INDEX/evmd\" --chain-id zentrax-devnet-1 --minimum-gas-prices=0atest"]
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:26657/status | grep -q latest_block_height"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 30s
  networks:
    zentrax:
      ipv4_address: 172.30.0.10

services:
  init:
    image: zentrax-evmd:0.7.4
    build:
      context: .
      dockerfile: Dockerfile
    user: "${ZENTRAX_UID:-1000}:${ZENTRAX_GID:-1000}"
    working_dir: /data
    environment:
      HOME: /data
    volumes:
      - ${ZENTRAX_DEVNET_DATA:-./.local-data}:/data
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /data/node0/evmd/config/genesis.json ]; then
          evmd testnet init-files --validator-count 4 --chain-id zentrax-devnet-1 --output-dir /data --node-daemon-home evmd --starting-ip-address 172.30.0.10 --keyring-backend test
          # The upstream init-files command writes genesis/config/app.toml but does not
          # write config/client.toml. The application reads its BaseApp chain ID from
          # that client config when evmd start constructs the app.
          for i in 0 1 2 3; do
            printf '%s\n' 'chain-id = "zentrax-devnet-1"' > "/data/node$$i/evmd/config/client.toml"
          done
          for i in 0 1 2 3; do
            peers=""
            for j in 0 1 2 3; do
              [ "$$i" = "$$j" ] && continue
              node_id="$$(evmd comet show-node-id --home "/data/node$$j/evmd")"
              peers="${peers:+$$peers,}$$node_id@node$$j:26656"
            done
            sed -i "s|^persistent_peers = .*|persistent_peers = \"$$peers\"|" "/data/node$$i/evmd/config/config.toml"
            # Cosmos EVM requires the CometBFT application mempool.
            sed -i 's/^type = "flood"$$/type = "app"/' "/data/node$$i/evmd/config/config.toml"
            grep -Fq 'type = "app"' "/data/node$$i/evmd/config/config.toml" || { echo "Failed to configure app mempool for node $$i" >&2; exit 1; }
            grep -Fq 'chain-id = "zentrax-devnet-1"' "/data/node$$i/evmd/config/client.toml" || { echo "Missing client chain ID for node $$i" >&2; exit 1; }
          done
        else
          echo "Existing local devnet genesis found; preserving node keys and state."
        fi
    networks:
      zentrax:
        ipv4_address: 172.30.0.9

  node0:
    <<: *node-common
    environment: { NODE_INDEX: "0", HOME: /data }
    ports:
      - "127.0.0.1:26657:26657"
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:1317:1317"
    networks:
      zentrax:
        ipv4_address: 172.30.0.10
    depends_on:
      init:
        condition: service_completed_successfully

  node1:
    <<: *node-common
    environment: { NODE_INDEX: "1", HOME: /data }
    ports:
      - "127.0.0.1:26667:26657"
      - "127.0.0.1:8555:8545"
      - "127.0.0.1:1327:1317"
    networks:
      zentrax:
        ipv4_address: 172.30.0.11
    depends_on:
      init:
        condition: service_completed_successfully

  node2:
    <<: *node-common
    environment: { NODE_INDEX: "2", HOME: /data }
    ports:
      - "127.0.0.1:26677:26657"
      - "127.0.0.1:8565:8545"
      - "127.0.0.1:1337:1317"
    networks:
      zentrax:
        ipv4_address: 172.30.0.12
    depends_on:
      init:
        condition: service_completed_successfully

  node3:
    <<: *node-common
    environment: { NODE_INDEX: "3", HOME: /data }
    ports:
      - "127.0.0.1:26687:26657"
      - "127.0.0.1:8575:8545"
      - "127.0.0.1:1347:1317"
    networks:
      zentrax:
        ipv4_address: 172.30.0.13
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  zentrax:
    ipam:
      config:
        - subnet: 172.30.0.0/24
