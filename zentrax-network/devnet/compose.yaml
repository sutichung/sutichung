name: zentrax-local-devnet

x-node-common: &node-common
  image: zentrax-evmd:0.7.4
  restart: unless-stopped
  user: "${ZENTRAX_UID:-1000}:${ZENTRAX_GID:-1000}"
  working_dir: /data
  environment:
    HOME: /data
  volumes:
    - ${ZENTRAX_DEVNET_DATA:-./.local-data}:/data
  entrypoint: ["/bin/sh", "-ec"]
  command: ["exec evmd start --home \"/data/node$$NODE_INDEX/evmd\" --chain-id zentrax-devnet-1 --minimum-gas-prices=0atest"]
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:26657/status | grep -q latest_block_height"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 30s
  networks:
    zentrax:
      ipv4_address: 172.30.0.10

services:
  init:
    image: zentrax-evmd:0.7.4
    build:
      context: .
      dockerfile: Dockerfile
    user: "${ZENTRAX_UID:-1000}:${ZENTRAX_GID:-1000}"
    working_dir: /data
    environment:
      HOME: /data
    volumes:
      - ${ZENTRAX_DEVNET_DATA:-./.local-data}:/data
      - ./init.sh:/usr/local/bin/zentrax-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/zentrax-init.sh"]
    networks:
      zentrax:
        ipv4_address: 172.30.0.9

  node0:
    <<: *node-common
    environment: { NODE_INDEX: "0", HOME: /data }
    ports:
      - "127.0.0.1:26657:26657"
      - "127.0.0.1:8545:8545"
      - "127.0.0.1:1317:1317"
    networks:
      zentrax:
        ipv4_address: 172.30.0.10
    depends_on:
      init:
        condition: service_completed_successfully

  node1:
    <<: *node-common
    environment: { NODE_INDEX: "1", HOME: /data }
    ports:
      - "127.0.0.1:26667:26657"
      - "127.0.0.1:8555:8545"
      - "127.0.0.1:1327:1317"
    networks:
      zentrax:
        ipv4_address: 172.30.0.11
    depends_on:
      init:
        condition: service_completed_successfully

  node2:
    <<: *node-common
    environment: { NODE_INDEX: "2", HOME: /data }
    ports:
      - "127.0.0.1:26677:26657"
      - "127.0.0.1:8565:8545"
      - "127.0.0.1:1337:1317"
    networks:
      zentrax:
        ipv4_address: 172.30.0.12
    depends_on:
      init:
        condition: service_completed_successfully

  node3:
    <<: *node-common
    environment: { NODE_INDEX: "3", HOME: /data }
    ports:
      - "127.0.0.1:26687:26657"
      - "127.0.0.1:8575:8545"
      - "127.0.0.1:1347:1317"
    networks:
      zentrax:
        ipv4_address: 172.30.0.13
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  zentrax:
    ipam:
      config:
        - subnet: 172.30.0.0/24
